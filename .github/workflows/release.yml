name: Release and publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Check dependency security
        run: npm audit

      - name: Typecheck, test, and build
        run: |
          npm run typecheck
          npm test
          npm run build
          node scripts/verify-package-version.mjs
          npm run check:skills

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Prepare release artifact directory
        if: matrix.os == 'ubuntu-24.04' && matrix.node-version == '24.x'
        run: mkdir -p release

      - name: Pack release artifact
        if: matrix.os == 'ubuntu-24.04' && matrix.node-version == '24.x'
        run: npm pack --ignore-scripts --pack-destination release

      - name: Upload verified npm package
        if: matrix.os == 'ubuntu-24.04' && matrix.node-version == '24.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified package to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.x

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.7.0

      - name: Download verified npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release

      - name: Publish to npm using OIDC
        run: npm publish ./release/*.tgz --access public --provenance --ignore-scripts

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" release/*.tgz --repo "$GITHUB_REPOSITORY"
