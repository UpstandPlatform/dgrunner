name: Release & Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build-and-publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create GitHub Release
      id-token: write   # CRITICAL: Required for npm Trusted Publishing (OIDC) & provenance attestations

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Upgrade npm to latest (Required for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Distribution
        run: npm run build

      - name: Verify Package Contents
        run: npm pack --dry-run

      - name: Ensure clean .npmrc for OIDC Trusted Publishing
        run: |
          rm -f ~/.npmrc .npmrc "$NPM_CONFIG_USERCONFIG"
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          fi

      - name: Publish to npm (Trusted Publishing / Provenance)
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/index.js
