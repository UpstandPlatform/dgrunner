name: Release & Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build-and-publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create GitHub Release
      id-token: write   # CRITICAL: Required for npm Trusted Publishing (OIDC) & provenance attestations

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Distribution
        run: npm run build

      - name: Verify Package Contents
        run: npm pack --dry-run

      - name: Publish to npm (Trusted Publisher / Provenance)
        run: npm publish --access public --provenance
        env:
          # If npm Trusted Publisher OIDC is configured, npm uses id-token.
          # If using traditional token, NODE_AUTH_TOKEN is used as fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/index.js
